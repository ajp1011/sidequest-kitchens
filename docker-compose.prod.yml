services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: sidequest-kitchens:production
    container_name: sidequest-kitchens-app-prod
    restart: always
    working_dir: /var/www
    volumes:
      - ./docker/php/production.ini:/usr/local/etc/php/conf.d/local.ini:ro
      - storage-data:/var/www/storage
      - cache-data:/var/www/bootstrap/cache
      - app-public:/var/www/public
    environment:
      - CONTAINER_ROLE=app
    networks:
      - sidequest-kitchens-prod
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: sidequest-kitchens-nginx-prod
    restart: always
    expose:
      - "80"
    volumes:
      - app-public:/var/www/public:ro
      - storage-data:/var/www/storage:ro
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sidequest-kitchens-prod
      - skaldic-codeworks-prod
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: sidequest-kitchens-db-prod
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - dbdata-prod:/var/lib/mysql
      - ./docker/mysql/production.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - sidequest-kitchens-prod
    command: --default-authentication-plugin=mysql_native_password

volumes:
  dbdata-prod:
    driver: local
  storage-data:
    driver: local
  cache-data:
    driver: local
  app-public:
    driver: local

networks:
  sidequest-kitchens-prod:
    driver: bridge
  skaldic-codeworks-prod:
    external: true
    name: skaldic-codeworks-prod
